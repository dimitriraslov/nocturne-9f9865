 $('#mbox').style.setProperty('--ox',p.x+'px');$('#mbox').style.setProperty('--oy',(p.y-80)+'px');
 $('#mt').innerHTML=`<span style="color:${COL[k]}">${b.name}'s Lair</span> <span style="font-size:12px;opacity:.7;font-weight:600">Level ${s.lvl}</span>`;$('#ms').textContent=b.sub;
 const pf=s.pf===Infinity?'∞':s.pf.toFixed(2);
 $('#stats').innerHTML=[['Net P&L',`<span class="${s.net>=0?'pos':'neg'}">${fm(s.net,2)}</span>`],['Win rate',s.n?(s.wr*100).toFixed(1)+'%':'—'],['Profit factor',s.n?pf:'—'],
  ['Closed net (bal)',`<span class="${s.net>=0?'pos':'neg'}">${fm(s.net,2)}</span>`],['Floating',s.hasFl?`<span class="${s.fl>=0?'pos':'neg'}">${fm(s.fl,2)}</span>`:'—'],['Net incl. open (eq)',`<span class="${s.net+s.fl>=0?'pos':'neg'}">${fm(s.net+s.fl,2)}</span>`],['Trades',s.n],['Open',s.open.length],['Streak',s.streak?(s.streak>0?'W':'L')+Math.abs(s.streak):'—'],['Max DD',fm(-s.dd)],['HP',Math.round(s.hp*100)+'%'],['Today',fm(s.today)]]
  .map(([a,v])=>`<div class="stat"><div class="k">${a}</div><div class="v">${v}</div></div>`).join('');
 const os=new Set(s.open.map(o=>o.strat));
 $('#hh').textContent=`${k==='uni'?'Sleeves':'Heads / tentacles'} (${b.heads.length}) · glow = open trade`;
 const hs=[...new Set([...b.heads,...Object.keys(s.headNet)])];
 $('#heads').innerHTML=hs.map(h=>{const n=s.headNet[h];return `<span class="hd ${os.has(h)?'on':''} ${n>0?'pos':n<0?'neg':''}">${h}${n!==undefined?' · '+fm(n):''}</span>`}).join('')||'—';
 const ofl=o=>o.pnl==null?'—':`<b class="${o.pnl>=0?'pos':'neg'}">${o.pnl>=0?'+':''}${fm(o.pnl,2)}</b>`;
 $('#open').innerHTML=(k!=='uni'?`<div class="sm" style="margin-bottom:6px;opacity:.7">${LIVE?'As of '+LIVE.asof_et+' ET'+(STALE?' <span class="stale">⚠ stale ('+Math.round(AGE)+' min old)</span>':''):'<span class="stale">⚠ no live feed</span>'}</div>`:'')+(s.open.length?'<div class="tw"><table><thead><tr><th>Strategy</th><th>Symbol</th><th>Side</th><th>Opened</th><th>Lots</th><th>Entry</th><th>Now</th><th>Stop</th><th>TP</th><th>Floating</th></tr></thead><tbody>'+s.open.map(o=>`<tr><td>${o.strat}</td><td>${o.sym}</td><td>${o.side}</td><td>${o.open}</td><td>${o.lots??'—'}</td><td>${o.entry}</td><td>${o.price??'—'}</td><td>${o.stop}</td><td>${o.tp??'—'}</td><td>${ofl(o)}</td></tr>`).join('')+'</tbody></table></div>':(k==='uni'||LIVE?'None open':'None known (no live feed — last pull Oct 27)'));
 $('#gaps').innerHTML=D.gaps.map(g=>'• '+g).join('<br>');
 $('#modal').classList.add('on');$('#modal').scrollTop=0;requestAnimationFrame(()=>{const c=$('#interior');iW=c.clientWidth;iH=c.clientHeight;ic=fit(c,iW,iH);drawLog();drawEq()})}
function drawLog(){const s=S[cur];const cols=[['open','Open'],['close','Close'],['sym','Symbol'],['strat','Strategy'],['side','Dir'],['entry','Entry'],['exit','Exit'],['pnl','P&L'],['R','R'],['reason','Exit reason']];
 const t=[...s.t].sort((a,b)=>{const x=a[sortK],y=b[sortK];return (x>y?1:x<y?-1:0)*sortD});
 $('#log').innerHTML='<thead><tr>'+cols.map(([c,n])=>`<th data-k="${c}">${n}${sortK===c?(sortD<0?' ↓':' ↑'):''}</th>`).join('')+'</tr></thead><tbody>'+
  (t.length?t.map(x=>`<tr><td>${x.open}</td><td>${x.close}</td><td>${x.sym}</td><td>${x.strat}</td><td>${x.side}</td><td>${x.entry??''}</td><td>${x.exit!=null?+x.exit.toFixed(5):''}</td><td class="${x.pnl>=0?'pos':'neg'}">${fm(x.pnl,2)}</td><td>${x.R!=null?x.R.toFixed(2):''}</td><td>${x.reason||''}</td></tr>`).join(''):'<tr><td colspan="10">No trades yet</td></tr>')+'</tbody>';
 document.querySelectorAll('#log th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(sortK===k)sortD=-sortD;else{sortK=k;sortD=-1}beep(700,.04);drawLog()})}
function drawEq(){const c=$('#eq'),w=c.clientWidth,h=c.clientHeight,g=fit(c,w,h),e=S[cur].eq;
 g.strokeStyle='rgba(255,255,255,.06)';g.lineWidth=1;for(let y=20;y<h;y+=28){g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke()}
 if(e.length<2){g.fillStyle='rgba(255,255,255,.5)';g.font='600 13px system-ui';g.textAlign='center';g.fillText('No trades yet',w/2,h/2);return}
 const mn=Math.min(...e),mx2=Math.max(...e),rg=(mx2-mn)||1,X=i=>14+i/(e.length-1)*(w-28),Y=v=>h-16-(v-mn)/rg*(h-36);
 g.setLineDash([4,4]);g.strokeStyle='rgba(255,255,255,.25)';g.beginPath();g.moveTo(0,Y(0));g.lineTo(w,Y(0));g.stroke();g.setLineDash([]);
 const up=e[e.length-1]>=0,col=up?'#6dffa6':'#ff6b7b';
 const fg=g.createLinearGradient(0,0,0,h);fg.addColorStop(0,rgba(col,.35));fg.addColorStop(1,rgba(col,0));
 g.beginPath();e.forEach((v,i)=>i?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v)));g.lineTo(X(e.length-1),h);g.lineTo(X(0),h);g.fillStyle=fg;g.fill();
 g.beginPath();e.forEach((v,i)=>i?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v)));g.strokeStyle=col;g.lineWidth=2.5;g.lineJoin='round';g.shadowColor=col;g.shadowBlur=12;g.stroke();g.shadowBlur=0;
 e.forEach((v,i)=>{g.fillStyle='#fff';g.beginPath();g.arc(X(i),Y(v),2.5,0,7);g.fill()});
 g.fillStyle='rgba(255,255,255,.7)';g.font='600 11px system-ui';g.fillText(fm(mx2),8,14);g.fillText(fm(mn),8,h-4)}
function interior(t){if(cur&&ic){const g=ic,w=iW,h=iH,s=S[cur],sc=h/260;
 const th={hydra:['#0d2a22','#04100c','#3aff9a'],exodia:['#2a2236','#0c0a14','#ff9a4a'],uni:['#2a1e5a','#0c0824','#c79bff']}[cur];
 const bg=g.createLinearGradient(0,0,0,h);bg.addColorStop(0,th[0]);bg.addColorStop(1,th[1]);g.fillStyle=bg;g.fillRect(0,0,w,h);
 // back arches
 g.strokeStyle=rgba(th[2],.08);g.lineWidth=18*sc;for(let i=0;i<4;i++){g.beginPath();g.arc(w*(.15+i*.25),h,h*.75,Math.PI,0);g.stroke()}
 glow(g,w*.62,h*.45,h*.9,th[2],.12);
 for(const tx of [w*.06,w*.94]){const f=.8+.2*Math.sin(t/90+tx);glow(g,tx,h*.3,60*sc*f,'#ff9a3a',.5);g.fillStyle='#ffd27a';g.beginPath();g.ellipse(tx,h*.3,4*sc,8*sc*f,0,0,7);g.fill();g.fillStyle='#3a2616';g.fillRect(tx-2*sc,h*.3+6*sc,4*sc,22*sc)}
 const fl=g.createLinearGradient(0,h*.82,0,h);fl.addColorStop(0,'rgba(0,0,0,.35)');fl.addColorStop(1,'rgba(0,0,0,.7)');g.fillStyle=fl;g.fillRect(0,h*.82,w,h);
 if(cur==='hydra')for(let i=0;i<18;i++){const tw=.5+.5*Math.sin(t/500+i);g.fillStyle=`rgba(255,215,106,${.4+.6*tw})`;g.beginPath();g.arc((i*97)%w,h*.86+(i%3)*6,1.8+tw,0,7);g.fill()}
 hoard(g,cur,w,h,sc,t);
 // terminal
 const tw2=Math.min(w*.42,300*sc),tx=w*.5,ty=h*.18,th2=tw2*.55;
 g.fillStyle='rgba(0,0,0,.5)';g.beginPath();g.roundRect(tx-8,h*.8,tw2+16,8*sc,4);g.fill();
 g.save();g.globalCompositeOperation='lighter';glow(g,tx+tw2/2,ty+th2/2,tw2*.8,s.net>=0?'#6dffa6':'#ff6b7b',.22);g.restore();
 g.fillStyle='#0b0e1e';g.strokeStyle=rgba(th[2],.5);g.lineWidth=1.5;g.beginPath();g.roundRect(tx,ty,tw2,th2,10);g.fill();g.stroke();
 g.fillStyle='#1a1e3a';g.fillRect(tx+tw2/2-4,ty+th2,8,h*.8-ty-th2);
 const e=s.eq,col=s.net>=0?'#6dffa6':'#ff6b7b';g.fillStyle='rgba(255,255,255,.85)';g.font=`700 ${13*sc}px system-ui`;g.fillText(fm(s.net,2),tx+12,ty+22*sc);
 g.fillStyle='rgba(255,255,255,.45)';g.font=`600 ${9*sc}px system-ui`;g.fillText(`${s.n} trades · WR ${(s.wr*100).toFixed(0)}%`,tx+12,ty+36*sc);
 if(e.length>1){const mn=Math.min(...e),mx2=Math.max(...e),rg=(mx2-mn)||1;g.beginPath();e.forEach((v,i)=>{const X=tx+12+i/(e.length-1)*(tw2-24),Y=ty+th2-12-(v-mn)/rg*(th2-56*sc);i?g.lineTo(X,Y):g.moveTo(X,Y)});g.strokeStyle=col;g.lineWidth=2;g.shadowColor=col;g.shadowBlur=10;g.stroke();g.shadowBlur=0}
 const sy=(t/20)%th2;g.fillStyle='rgba(255,255,255,.04)';g.fillRect(tx,ty+sy,tw2,3);
 if(cur==='hydra')hydraDraw(g,tx-70*sc,h*.84,1.5*sc,t,s);else if(cur==='exodia')exodiaDraw(g,tx-60*sc,h*.84,1.6*sc,t,s);else uniDraw(g,tx-80*sc,h*.84,1.7*sc,t,s,false);
 if(s.mood<-.05){g.strokeStyle='rgba(160,185,255,.25)';g.lineWidth=1;for(let i=0;i<60*-s.mood;i++){const x=(i*53+t/3)%w,y=(i*37+t/1.5)%h;g.beginPath();g.moveTo(x,y);g.lineTo(x+2,y-10);g.stroke()}}
 else if(s.mood>.05){g.save();g.globalCompositeOperation='lighter';for(let i=0;i<30*s.mood+4;i++){const a=Math.max(0,Math.sin(t/400+i));glow(g,(i*131+Math.sin(t/900+i)*30)%w,h*.15+(i*71)%(h*.65),6,'#eaff70',.6*a)}g.restore()}
 lava(g,w,h,h*.45,t,cur==='uni'?lavaOf(100000+S.uni.net):LAVA)}requestAnimationFrame(interior)}
$('#close').onclick=()=>{$('#modal').classList.remove('on');cur=null;beep(330)};
$('#modal').onclick=e=>{if(e.target.id==='modal')$('#close').onclick()};
addEventListener('keydown',e=>{if(e.key==='Escape')$('#close').onclick()});
layout();requestAnimationFrame(frame);requestAnimationFrame(interior);
// ---------- auto-update: poll live.json; when as-of changes, re-render in place (soft reload keeps open lair + scroll) ----------
(function(){const u=QP.get('live')||'live.json';if(u==='0')return;let busy=false;
 try{const st=JSON.parse(sessionStorage.getItem('lairState')||'null');sessionStorage.removeItem('lairState');if(st){if(st.y)scrollTo(0,st.y);if(st.open&&D.books[st.open])setTimeout(()=>{openLair(st.open);$('#modal').scrollTop=st.my||0},50)}}catch(e){}
 async function poll(){if(busy||document.hidden)return;busy=true;try{const r=await fetch(u+(u.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store'});if(r.ok){const j=await r.json();
  if(j&&isFinite(j.balance)&&(!LIVE||j.asof_utc!==LIVE.asof_utc||j.equity!==LIVE.equity||j.uni_asof!==LIVE.uni_asof)){try{sessionStorage.setItem('lairState',JSON.stringify({open:cur,y:scrollY,my:$('#modal').scrollTop}))}catch(e){}location.reload();return}}
  if(LIVE){const a=(Date.now()/1000-LIVE.asof_utc)/60;if(a>30)$('#upd').innerHTML='Live '+LIVE.asof_et.slice(5,16)+' ET <span class="stale">⚠ stale '+(a>120?Math.round(a/60)+'h':Math.round(a)+'m')+'</span>'}}catch(e){}busy=false}
 setInterval(poll,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});addEventListener('focus',poll);addEventListener('pageshow',e=>{if(e.persisted)poll()})})();
</script></body></html>
