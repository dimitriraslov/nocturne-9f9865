<style>
:root{--bg:#0b1020;--ink:#e8e3c8;--gold:#f2c14e;--grn:#3cff7a;--red:#ff5a5a;--navy:#16223f;--line:#2b3a66}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.35 ui-monospace,Menlo,Consolas,monospace;-webkit-font-smoothing:none}
#wrap{max-width:980px;margin:0 auto;padding:8px 8px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 2px 8px}
h1{font-size:15px;margin:0;color:var(--gold);letter-spacing:2px;text-transform:uppercase}
#upd{font-size:11px;opacity:.75}
button{font:inherit;color:var(--ink);background:var(--navy);border:2px solid var(--line);padding:5px 8px;cursor:pointer;border-radius:0}
button:active{transform:translateY(1px)}
#stage{display:flex;justify-content:center}
canvas#floor{image-rendering:pixelated;image-rendering:crisp-edges;display:block;border:3px solid #000;box-shadow:0 0 0 3px var(--line);cursor:pointer;touch-action:manipulation}
#booths{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.bc{background:var(--navy);border:3px solid var(--line);padding:8px;cursor:pointer;text-align:left;box-shadow:4px 4px 0 #000}
.bc b{display:block;color:var(--gold);font-size:12px;letter-spacing:1px}.bc .n{font-size:22px;color:var(--grn);text-shadow:0 0 6px #1f8}
.bc small{opacity:.75;font-size:11px}
@media(max-width:560px){#booths{grid-template-columns:1fr}.bc{display:flex;align-items:center;gap:10px}.bc .n{min-width:46px;text-align:center}}
#modal{position:fixed;inset:0;background:rgba(3,6,14,.97);display:none;z-index:10;overflow:auto;-webkit-overflow-scrolling:touch}
#modal.on{display:block}
#panel{max-width:980px;margin:0 auto;padding:10px 10px 60px}
.ph{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--bg);padding:8px 0;border-bottom:3px solid var(--line);z-index:2}
.ph h2{margin:0;font-size:15px;color:var(--gold);letter-spacing:2px}
.ctl{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.ctl select,.ctl input{font:inherit;background:#0f1730;color:var(--ink);border:2px solid var(--line);padding:5px;border-radius:0}
.chip.on{background:var(--gold);color:#000;border-color:#000}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.card{background:#111a35;border:3px solid var(--line);padding:8px;box-shadow:3px 3px 0 #000;position:relative}
.card h3{margin:0 0 4px;font-size:12px;color:#fff;padding-right:70px}
.badge{position:absolute;top:6px;right:6px;font-size:10px;padding:2px 4px;border:2px solid #000;color:#000;text-transform:uppercase}
.b-keeper{background:var(--grn)}.b-start-small{background:#8fd3ff}.b-shelved{background:#c9a3ff}.b-dropped{background:#888}.b-hand{background:var(--gold)}.b-screened{background:#5b6377}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:2px 6px;font-size:11px;margin-top:4px}.kv span{opacity:.65;display:block;font-size:9px;text-transform:uppercase}
.meta{font-size:10px;opacity:.7;margin-top:4px}
.star{color:var(--gold)}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:6px 4px;border-bottom:2px solid #1b2547;text-align:left;vertical-align:top}
th{color:var(--gold);font-size:10px;text-transform:uppercase;position:sticky;top:44px;background:var(--bg)}
.L{display:inline-block;width:10px;height:10px;border:2px solid #000;margin-right:3px;vertical-align:-1px}
.L.bull{background:var(--grn);box-shadow:0 0 5px var(--grn)}.L.bear{background:var(--red)}.L.na{background:#555}
.hl{font-size:11px;opacity:.85}.hl a{color:#8fd3ff}
.buy{background:#071a0e;border:3px solid #1f6b37;padding:8px;margin-bottom:8px;box-shadow:3px 3px 0 #000}
.buy .top{display:flex;justify-content:space-between;align-items:baseline}.buy .sym{font-size:18px;color:var(--grn);font-weight:bold}
.tod{border-color:var(--gold);background:#1d1606}.tod .sym{color:var(--gold)}
.pill{font-size:10px;padding:1px 4px;border:2px solid #000;background:var(--grn);color:#000;margin-left:4px}
.drawer{margin-top:12px;border:3px dashed var(--gold);padding:8px}
.idea{padding:6px 0;border-bottom:2px solid #1b2547}.idea b{color:var(--gold);font-size:10px;text-transform:uppercase;margin-right:6px}
.note{font-size:11px;opacity:.7;margin:6px 0}

 for(const w of walkers){w.x+=w.vx;w.y+=w.vy;if(w.x<2||w.x>186)w.vx*=-1;if(w.y<138||w.y>232)w.vy*=-1;if(!inBooth(w.x,w.y))person(w.x,w.y,w.c,w.s,(T/10)%2<1)}
 vx.imageSmoothingEnabled=false;vx.drawImage(buf,0,0,cv.width,cv.height);requestAnimationFrame(draw)}
function inBooth(x,y){return B.some(b=>x>b.x-6&&x<b.x+b.w&&y>b.y-9&&y<b.y+b.h)}
function fmt(v){if(v==null)return '-';const a=Math.abs(v);return a>=1000?v.toLocaleString('en-US',{maximumFractionDigits:0}):a>=1?v.toFixed(2):v.toFixed(4)}
let TK='';function tick(){if(TK)return TK;if(!D)return 'LOADING';TK=D.opps.map(o=>o.sym+' '+fmt(o.price)+' ▲').concat(D.portfolio.map(p=>p.sym+' '+fmt(p.price))).join('  ');return TK}
// integer scaling for crisp pixels
function fit(){const dpr=window.devicePixelRatio||1,vw=Math.min(innerWidth-22,720),vh=Math.max(innerHeight*0.75,420);let k=Math.max(1,Math.floor(Math.min(vw/W,vh/H)*dpr));/* integer device pixels per art pixel = crisp */cv.width=W*k;cv.height=H*k;cv.style.width=(W*k/dpr)+'px';cv.style.height=(H*k/dpr)+'px'}
addEventListener('resize',fit);
cv.addEventListener('click',e=>{const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;const b=B.find(b=>x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h);if(b)open(b.k)});
// ---- sound (muted until tap)
let snd=localStorage.getItem('tfSnd')=='1',AC=null;
function setSnd(){$('#snd').textContent=snd?'🔔':'🔇'}setSnd();
$('#snd').onclick=()=>{snd=!snd;localStorage.setItem('tfSnd',snd?'1':'0');setSnd();if(snd)bell()};
function bell(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime;for(let i=0;i<3;i++)[880,1320,2210].forEach((f,j)=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(.0001,t+i*.35);g.gain.exponentialRampToValueAtTime(.25/(j+1),t+i*.35+.01);g.gain.exponentialRampToValueAtTime(.0001,t+i*.35+1.2);o.connect(g).connect(AC.destination);o.start(t+i*.35);o.stop(t+i*.35+1.3)})}catch(e){}}
function checkFresh(){if(!D)return;const key=D.opps.filter(o=>o.fresh).map(o=>o.sym+o.flip_date).join(',');const seen=localStorage.getItem('tfFresh')||'';if(key&&key!==seen){localStorage.setItem('tfFresh',key);if(snd)bell()}}
// ---- booth cards
function booths(){const c=D.counts,o=D.opps[0];$('#booths').innerHTML=[
 ['research','🤖 Research Lab',c.research,`${c.keepers} keepers · ${c.ideas} untested ideas`],
 ['portfolio','📋 Portfolio Desk',c.names,`${D.portfolio.filter(p=>p.d=='bull').length} daily bull · ${D.portfolio.filter(p=>p.tag=='held').length} held`],
 ['opps','🔔 Opportunity Pit',c.opps,o?`★ Trader of the day: ${o.sym} · risk ${o.risk}%`:'No buy setups today']
].map(([k,t,n,s])=>`<div class="bc" data-k="${k}"><div class="n">${n}</div><div><b>${t}</b><small>${s}</small></div></div>`).join('');
 document.querySelectorAll('.bc').forEach(e=>e.onclick=()=>open(e.dataset.k));
 $('#upd').textContent='Data '+D.built_et.replace(/^\w+ /,'')}
// ---- panels
let cur=null,RS={st:'all',asset:'all',sort:'pf_blind',q:'',ideas:false};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const v=(x,d=2)=>x==null||x===''?'–':(+x).toFixed(d).replace(/\.0+$/,'');
function open(k){cur=k;$('#modal').classList.add('on');document.body.style.overflow='hidden';render();history.replaceState(null,'','#'+k)}
function close(){cur=null;$('#modal').classList.remove('on');document.body.style.overflow='';history.replaceState(null,'',location.pathname)}
$('#modal').addEventListener('click',e=>{if(e.target.id=='modal'||e.target.closest('[data-x]'))close()});
addEventListener('keydown',e=>{if(e.key=='Escape')close()});
function head(t){return `<div class="ph"><h2>${t}</h2><button data-x>✕ Floor</button></div>`}
function render(){if(!cur||!D)return;const p=$('#panel'),y=$('#modal').scrollTop;p.innerHTML=cur=='research'?research():cur=='portfolio'?portfolio():opps();$('#modal').scrollTop=y;wire()}
const SL={keeper:'keeper','start-small':'start-small',shelved:'shelved',dropped:'dropped','hand queue':'hand','screened out':'screened'};
function research(){const C=D.research.cards;const sts=['all','keeper','start-small','shelved','dropped','hand queue','screened out'];
 let L=C.filter(c=>(RS.st=='all'||c.status==RS.st)&&(RS.asset=='all'||c.asset==RS.asset)&&(!RS.q||(c.name+' '+(c.family||'')+' '+(c.tf||'')).toLowerCase().includes(RS.q)));
 const sk=RS.sort;L.sort((a,b)=>sk=='name'?a.name.localeCompare(b.name):((b[sk]??-1e9)-(a[sk]??-1e9))*(sk=='luck'?-1:1));
 return head('🤖 RESEARCH LAB')+`<div class="note">Every public script the research gate has scored (TradingView waves + Codex pipeline). Metrics are blind (out-of-sample) unless noted. FTMO columns are the change vs the current book where tested, not absolute pass %.</div>
 <div class="ctl">${sts.map(s=>`<button class="chip ${RS.st==s?'on':''}" data-st="${s}">${s} ${s=='all'?C.length:C.filter(c=>c.status==s).length}</button>`).join('')}</div>
 <div class="ctl"><select data-f="asset">${['all','XAU','BTC'].map(a=>`<option ${RS.asset==a?'selected':''}>${a}</option>`)}</select>
 <select data-f="sort">${[['pf_blind','Blind PF'],['wr','Win rate'],['n','Trades'],['luck','Luck p (low first)'],['plateau','Plateau'],['ftmo_95k_pp','FTMO 95k Δ'],['name','Name']].map(([a,b])=>`<option value="${a}" ${RS.sort==a?'selected':''}>Sort: ${b}</option>`)}</select>
 <input data-f="q" placeholder="search name / family" value="${esc(RS.q)}"><button data-ideas>💡 Untested ideas (${D.research.ideas.length})</button></div>
 ${RS.ideas?ideas():''}<div class="grid">${L.map(card).join('')||'<div class="note">No cards match.</div>'}</div>`}
function card(c){return `<div class="card"><span class="badge b-${SL[c.status]}">${esc(c.status)}</span><h3>${c.star?'<span class="star">★ </span>':''}${esc(c.name)}</h3>
 <div class="meta">${esc(c.asset)} · ${esc(c.tf||'?')} ${esc(c.side||'')} ${c.family?'· '+esc(c.family):''}</div>
 <div class="kv"><div><span>WR</span>${c.wr!=null?v(c.wr,1)+'%':'–'}</div><div><span>PF</span>${v(c.pf??c.pf_train)}</div><div><span>Blind PF</span><b>${v(c.pf_blind)}</b></div><div><span>Trades</span>${v(c.n,0)}</div>
 <div><span>Luck p</span>${v(c.luck,3)}</div><div><span>Plateau</span>${v(c.plateau)}</div><div><span>FTMO 95k Δpp</span>${v(c.ftmo_95k_pp,1)}</div><div><span>Fresh Δdays</span>${v(c.ftmo_fresh_dd,1)}</div></div>
 ${c.note?`<div class="meta">${esc(c.note)}</div>`:''}<div class="meta">${esc(c.src)}</div></div>`}
function ideas(){return `<div class="drawer"><b class="star">💡 UNTESTED IDEAS</b><div class="note">Entry models, exit models, inputs and data the gate has not tried yet. Good hunting ground for the next Codex batch.</div>${D.research.ideas.map(i=>`<div class="idea"><b>${esc(i.kind)}</b>${esc(i.title)}<div class="hl">${esc(i.why)}</div></div>`).join('')}</div>`}
const lt=s=>`<i class="L ${s=='bull'||s=='bear'?s:'na'}"></i>`;
function portfolio(){return head('📋 PORTFOLIO DESK')+`<div class="note">Supertrend (10,3) from the daily scan of ${esc(D.scan_et)}. Stop = daily line when bull; when bear the line is where it turns green.</div>
 <table><tr><th>Name</th><th>Price</th><th>D / W</th><th>Stop / flip</th><th>Next event · latest headline</th></tr>${D.portfolio.map(p=>`<tr>
 <td><b>${esc(p.sym)}</b><div class="hl">${esc(p.tag)}</div></td><td>$${fmt(p.price)}<div class="hl">RSI ${v(p.rsi,0)}</div></td>
 <td>${lt(p.d)}${p.d_days??''}d<br>${lt(p.w)}${p.w_weeks??''}w</td>
 <td>${p.stop?`stop $${fmt(p.stop)}<div class="hl">risk ${p.risk}%</div>`:p.flip_line?`turns 🟢 $${fmt(p.flip_line)}<div class="hl">${p.away}% away</div>`:'–'}</td>
 <td class="hl">${p.next_event?`<b>📅 ${esc(p.next_event.date)}</b> ${esc(p.next_event.text)}<br>`:''}${p.headline?`📰 ${esc(p.headline.date)}: ${esc(p.headline.text)} ${p.headline.url?`<a href="${esc(p.headline.url.split(' ')[0])}" target="_blank" rel="noopener noreferrer">src</a>`:''}`:''}</td></tr>`).join('')}</table>`}
function opps(){const O=D.opps;return head('🔔 OPPORTUNITY PIT')+`<div class="note">Buy setups only: daily Supertrend flipped bullish in the last 10 bars and the weekly is bullish. Ranked early + low risk first. Scan ${esc(D.scan_et)}.</div>
 ${O.length?O.map((o,i)=>`<div class="buy ${i==0?'tod':''}">${i==0?'<div class="star">★ TRADER OF THE DAY</div>':''}<div class="top"><span class="sym">${esc(o.sym)}${o.fresh?'<span class="pill">FRESH</span>':''}${o.early?'<span class="pill">EARLY</span>':''}${o.held?'<span class="pill" style="background:#f2c14e">HELD</span>':''}</span><span>$${fmt(o.price)}</span></div>
 <div class="hl">${esc(o.name||'')} · ${esc(o.sector||'')}</div>
 <div class="kv"><div><span>Stop</span>$${fmt(o.stop)}</div><div><span>Risk</span>${o.risk}%</div><div><span>Since flip</span>${o.since>0?'+':''}${v(o.since,1)}%</div><div><span>Flip</span>${o.bars}d ago</div>
 <div><span>Weekly</span>🟢 ${o.w_weeks}w</div><div><span>RSI</span>${o.rsi}</div><div><span>Flip date</span>${esc(o.flip_date)}</div></div></div>`).join(''):'<div class="note">No buy setups right now.</div>'}`}
function wire(){const p=$('#panel');p.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{RS.st=b.dataset.st;render()});
 p.querySelectorAll('[data-f]').forEach(e=>e.oninput=()=>{RS[e.dataset.f]=e.dataset.f=='q'?e.value.toLowerCase():e.value;const f=e.dataset.f=='q';render();if(f){const q=p.querySelector('[data-f=q]');q.focus();q.setSelectionRange(q.value.length,q.value.length)}});
 const i=p.querySelector('[data-ideas]');if(i)i.onclick=()=>{RS.ideas=!RS.ideas;render()}}
// ---- live refresh (60s + focus), no reload
let busy=false;async function poll(){if(busy||document.hidden)return;busy=true;try{const r=await fetch('floor.json?t='+Date.now(),{cache:'no-store'});if(r.ok){const j=await r.json();if(!D||j.built_utc!==D.built_utc){D=j;TK='';booths();mkWalkers();checkFresh();if(cur)render()}}}catch(e){}busy=false}
setInterval(poll,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});addEventListener('focus',poll);addEventListener('pageshow',e=>{if(e.persisted)poll()});
fit();if(D){booths();mkWalkers();checkFresh()}draw();poll();
const h=location.hash.slice(1);if(['research','portfolio','opps'].includes(h))open(h);
</script></body></html>
